<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DDGS Trade Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: laptop = top tabs + wide list rows; phone = slim top bar + fixed bottom bar + compact cards. One page per PO, SO, buyer, plant, transporter, truck. */
:root{
  --bg:#f4f6f5; --card:#ffffff; --fg:#14201e; --mu:#5d6b68; --bd:#dfe6e3; --soft:#f8faf9;
  --ac:#0f7a5f; --acs:#e3f3ed; --ink:#13201d;
  --ok:#137a4b; --oks:#e2f5ea; --wn:#9a5a00; --wns:#fdf1dc; --bad:#b3261e; --bads:#fde8e6; --info:#3b4fb8; --infos:#eceffd;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --m:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --navh:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:30}
.top{display:flex;align-items:center;gap:12px;padding:10px 0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ac);display:grid;place-items:center;flex:none}
.logo svg{width:21px;height:21px}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12px;color:var(--mu)}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.who{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;min-height:36px}
.who span{color:var(--mu);font-weight:500}
#nav{display:flex;gap:2px;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;border:0;background:transparent;padding:9px 13px;border-radius:9px;font-weight:600;color:var(--mu);white-space:nowrap}
#nav button.on{background:var(--acs);color:var(--ac)}
#nav .cnt{font-weight:500;opacity:.75}
.firmbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.firmbar .seg{margin:0}
.ftag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;border:1px solid currentColor;white-space:nowrap;vertical-align:1px}
.ftag.f0{color:#0f7a5f}.ftag.f1{color:#3b4fb8}.ftag.f2{color:#9b2c66}
.tag.own{background:var(--infos);color:var(--info)}
.ntsm{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--mu);vertical-align:-5px;margin-left:2px}
.ntsm:hover{background:var(--soft);color:var(--ac)}
.ntsm svg{width:13px;height:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
.bar .search{flex:1 1 260px;margin:0}
.tbl{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.tbl > .tr:first-child{border-radius:12px 12px 0 0}
.tbl > .tr:last-child{border-radius:0 0 12px 12px}
.tr{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--bd)}
.tr:first-child{border-top:0}
.th{position:sticky;top:var(--hh,0px);z-index:5;box-shadow:0 1px 0 var(--bd);background:var(--soft);font-size:11.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;padding:9px 14px}
.tr.cx{opacity:.5}
.td{min-width:0;overflow-wrap:anywhere}
.td.r,.th .r{text-align:right}
.td small,.td .sm{display:block;color:var(--mu);font-size:12px}
.tfoot{background:var(--soft);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;border:1px solid var(--bd);background:var(--card);white-space:nowrap;min-height:32px;color:var(--fg)}
.pill.ok{background:var(--oks);color:var(--ok);border-color:#bfe5d0}
.pill.wait{color:var(--mu)}
.pill.add{background:#fff9e8;color:#8a5a00;border-color:#f3dca2}
.pill.info{background:var(--infos);color:var(--info);border-color:#cfd6f7}
.nx{border:0;border-radius:9px;padding:7px 11px;font-weight:600;font-size:12.5px;background:var(--ac);color:#fff;white-space:nowrap;min-height:34px}
.nx.money{background:#1f5f99}
.acts{display:flex;gap:2px;justify-content:flex-end}
.ib{border:1px solid var(--bd);background:var(--card);width:34px;height:34px;border-radius:8px;color:var(--mu);font-size:17px;line-height:1}
.neg{color:var(--bad)}
.stages{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.stages button{border:1px solid var(--bd);background:var(--card);border-radius:11px;padding:10px 12px;text-align:left}
.stages b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stages span{font-size:12.5px;color:var(--mu)}
main{padding:16px 0 40px}
.sp{flex:1}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:20px 0 10px;font-weight:600}
h2:first-child{margin-top:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h1{font-size:20px;margin:0;letter-spacing:-.01em}
.ph .sub{color:var(--mu);font-size:13px;width:100%}
.ph .sp{flex:1}
.back{border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:8px 12px;font-weight:600;min-height:40px}
.btn{border:1px solid var(--bd);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;min-height:42px;white-space:nowrap}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mu)}
.btn.danger{color:var(--bad);border-color:#f2c4c0;background:var(--card)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px}
.newtab{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--mu)}
.newtab svg{width:16px;height:16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--mu);min-height:38px}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap;min-height:36px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip b{font-weight:700;margin-left:2px}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--bd);border-radius:11px;background:var(--card);min-height:44px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--mu)}
.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--mu)}
.kpi.warn .v{color:var(--wn)} .kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--ok)}
button.kpi{text-align:left;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:20px}
.prob{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--bd);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.prob:first-child{border-top:0}
.prob:hover{background:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--bad)}
.prob small{display:block;color:var(--mu)}
.todo{display:flex;flex-wrap:wrap;gap:8px}
.todo button{border:1px solid var(--bd);background:var(--card);border-radius:11px;padding:10px 12px;text-align:left;min-width:150px;flex:1}
.todo b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.todo span{font-size:12.5px;color:var(--mu)}
.empty{padding:22px 14px;color:var(--mu);text-align:center}
.prog{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:7px 0 5px}
.prog i{display:block;height:100%;background:var(--ac)}
.prog.over i{background:var(--bad)}
.oc{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--bd)}
.oc:first-child{border-top:0}
.oc .m{flex:1;min-width:0}
.oc .r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mu{color:var(--mu)} .num{font-variant-numeric:tabular-nums} .over{color:var(--bad)}
.idb{display:inline-block;background:var(--ink);color:#fff;font:700 11.5px/1.2 var(--m);padding:4px 7px;border-radius:6px;white-space:nowrap}
/* truck list */
.tl{display:flex;flex-direction:column;gap:8px}
.tc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px}
.tc.cx{opacity:.55}
.tc .info{flex:1;min-width:0;cursor:pointer}
.tc .l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tc .truck{font-weight:700;font-size:15px;letter-spacing:.02em}
.tc .l2{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .l3{margin-top:2px;font-size:12.5px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap}
.tc .money{text-align:right;min-width:120px;font-size:13px}
.tc .acts{display:flex;gap:6px;align-items:center;flex:none}
.next{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;white-space:nowrap}
.next.money{background:#1f5f99}
.done{color:var(--ok);font-weight:600;font-size:13px;padding:0 6px;white-space:nowrap}
.more{width:44px;height:44px;border:1px solid var(--bd);background:var(--card);border-radius:10px;font-size:20px;line-height:1;color:var(--mu)}
.stage{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
.s0{background:#eef1f0;color:#4a5753}.s1{background:#fdf1dc;color:#9a5a00}.s2{background:#e9eefc;color:#3b4fb8}.s3{background:#e6f1fb;color:#1f5f99}.s4{background:#fbeaf3;color:#9b2c66}.s5{background:#e2f5ea;color:#137a4b}.s6{background:#d7efe2;color:#0b5a36}.sx{background:#eee;color:#777}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--bads);color:var(--bad)}
.tag.wn{background:var(--wns);color:var(--wn)}
.tag.ok{background:var(--oks);color:var(--ok)}
.blist{max-height:46vh;overflow:auto;border:1px solid var(--bd);border-radius:10px;margin:0 18px}
.blist label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--bd);cursor:pointer}
.blist label:first-child{border-top:0}
.blist input{width:20px;height:20px;flex:none}
.blist .m{flex:1;min-width:0}
.btot{margin:10px 18px 0;padding:10px 12px;background:var(--soft);border-radius:9px;font-weight:600}
.showmore{display:block;margin:10px auto 0}
/* tables (laptop pages) */
.tblw{overflow:auto;max-height:calc(100vh - var(--hh,0px) - 24px);background:var(--card);border:1px solid var(--bd);border-radius:12px}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{position:sticky;top:0;z-index:2;background:var(--soft);color:var(--mu);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--bd)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
table.t tfoot td{font-weight:700;background:var(--soft)}
/* detail grid */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:0}
.dl div{padding:10px 14px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);min-width:0}
.dl dt{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.dl dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.alist{display:flex;flex-wrap:wrap;gap:8px}
/* modal / bottom sheet */
#modal{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.sheet{background:var(--card);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
.sheet h3{margin:0;padding:16px 18px 4px;font-size:17px}
.sheet .sub{padding:0 18px;color:var(--mu);font-size:13.5px}
.sheet .sub b{color:var(--fg)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px 18px}
.fg .full{grid-column:1/-1}
.fg label{display:block;font-size:12.5px;color:var(--mu);font-weight:500;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:#fff;min-height:44px}
.fg .ck{display:flex;align-items:center;gap:8px;padding-top:20px}
.fg .ck input{width:20px;height:20px;min-height:0}
.fg .sec{grid-column:1/-1;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);border-top:1px solid var(--bd);padding-top:12px;margin-top:4px}
.help{font-size:12px;color:var(--mu);margin-top:3px}
.hint{font-size:12.5px;color:var(--ac);font-weight:600;margin-top:3px;min-height:1em}
.fill{border:1px dashed var(--ac);background:var(--acs);color:var(--ac);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;margin-top:5px}
.msg{margin:0 18px;padding:10px 12px;border-radius:9px;font-size:13px}
.msg.err{background:var(--bads);color:var(--bad)}
.msg.warn{background:var(--wns);color:var(--wn)}
.foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 14px;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);border-radius:0 0 14px 14px}
.menu{display:flex;flex-direction:column;padding:8px 10px 4px}
.menu button,.menu a{display:block;text-align:left;border:0;background:none;padding:13px 10px;border-radius:9px;font-weight:500;font-size:15px;color:var(--fg)}
.menu button:hover,.menu a:hover{background:var(--soft);text-decoration:none}
.menu .danger{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;z-index:70;font-weight:500;max-width:92%}
.undo{background:none;border:0;color:#8ff0c8;font-weight:700;margin-left:12px;padding:0}
#load{padding:60px 0;text-align:center;color:var(--mu)}
.note{background:var(--infos);color:#28367f;border:1px solid #cfd6f7;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.auth{max-width:400px;margin:40px auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}
.auth h3{margin:0 0 4px;font-size:18px}
.auth p{margin:0 0 14px;color:var(--mu);font-size:13px}
.auth label{display:block;font-size:12.5px;color:var(--mu);font-weight:500;margin:12px 0 4px}
.auth input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:9px;min-height:44px}
.auth .btn{width:100%;margin-top:16px}
.list{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--bd)}
.list .row:first-child{border-top:0}
.list .row .m{flex:1;min-width:0}
.fab{display:none}
@media (max-width:860px){
  .top{padding:8px 0}
  .ttl b{font-size:15px}
  #nav{padding-bottom:6px}
  #nav button{padding:8px 11px;font-size:13.5px}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .th{display:none}
  .tr{grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px 14px}
  .td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
  .td.wide{grid-column:1/-1}
  .td.r{text-align:left}
  .acts{justify-content:flex-start;grid-column:1/-1}
  .stages{grid-template-columns:repeat(4,1fr)}
  .two{grid-template-columns:1fr}
  .tc{flex-wrap:wrap;padding:10px 12px}
  .tc .info{flex:1 1 100%}
  .tc .money{text-align:left;min-width:0;flex:1}
  .tc .acts{flex:1 1 100%}
  .tc .next{flex:1}
  .tc .done{flex:1}
  .dl{grid-template-columns:1fr 1fr}
  #toast{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:18px}
  .todo button{min-width:calc(50% - 4px)}
  .fg{grid-template-columns:1fr}
  #modal{padding:0;align-items:flex-end}
  .sheet{border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
  .foot{border-radius:0}
  .fab{display:block;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ac);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(15,122,95,.35)}
  .hide-phone{display:none}
  .ph h1{font-size:18px}
}
@media (min-width:861px){ .hide-laptop{display:none} }
@media (max-width:420px){ .stages{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.flow{margin:6px 0 14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.fl-root{display:inline-flex;flex-direction:column;gap:2px;background:var(--acs);border:1px solid var(--ac);border-radius:10px;padding:10px 14px;max-width:100%}
.fl-root b{font-size:15px}.fl-root span{font-size:12.5px;color:var(--mu)}
.fl-br{display:flex;flex-wrap:wrap;gap:14px 18px;margin-top:8px}
.fl-arm{display:flex;flex-direction:column;align-items:flex-start;max-width:100%}
.fl-line{display:block;height:24px;background:var(--ac);opacity:.5;border-radius:3px;margin-left:10px;position:relative}
.fl-line::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ac);opacity:.8}
.fb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--bd);background:var(--soft);border-radius:10px;padding:9px 11px;min-width:150px;max-width:260px;margin-top:10px}
.fb b{font-size:14px}.fb span{font-size:12px;color:var(--mu)}
.fb.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.fb.none{border-style:dashed;background:var(--wns);border-color:var(--wn)}
.fb.own{border-color:var(--info)}
.fl-note{margin-top:12px;font-size:12.5px;color:var(--mu)}
.link{border:0;background:none;color:var(--ac);font-weight:600;padding:0;cursor:pointer}

<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></div>
      <div class="ttl"><b id="co">DDGS Trade Control</b><span class="sync" id="sync">Connecting…</span></div>
      <div id="who"></div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main class="wrap" id="view"><div id="load">Opening…</div></main>
<button type="button" class="fab" id="fab" hidden data-act="newTruck">+ New truck</button>
<div id="modal" hidden><form class="sheet" id="mform" novalidate autocomplete="off"></form></div>
<div id="toast" hidden></div>
<div id="fails" hidden></div>

<script>
var D = null, P = {}, T = [], PO = {}, SO = {}, BUSY = false, TOKEN = null, PENDING_IMPORT = null;
var ROUTE = { v: 'home' }, HIST = [], LIMIT = 60, QS = '', FILTER = 'todo', FIRM = 'all', SUBF = { settle: 'all', freight: 'all' }, LASTIDS = [];
var STAGES = ['Vehicle placed', 'Loaded', 'Supplier paid', 'Unloaded', 'Part paid', 'Customer paid', 'Closed'];
var ROLE_HELP = { Owner: 'Everything, including users, profit and closed trucks', Accounts: 'Trucks, orders, payments, freight, Excel', Dispatch: 'Trucks, weights, unloading, choose customer. No money', Viewer: 'Sees everything, changes nothing' };
var ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
  trucks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18H7z"/><path d="M10 8h4M10 12h4M10 16h2"/></svg>',
  money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
  newtab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v6H4V6h6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
};

/* ---------- helpers ---------- */
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n(x) { var v = parseFloat(x); return isNaN(v) ? 0 : v; }
function r2(x) { return Math.round(x * 100) / 100; }
function inr(x) { var neg = x < 0; return (neg ? '-' : '') + '₹' + Math.round(Math.abs(x)).toLocaleString('en-IN'); }
function qt(x) { return n(x).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dmy(s) { if (!s) return ''; var p = String(s).split('-'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : s; }
function dm(s) { return dmy(s); } // dates are always shown in full: DD-MM-YYYY
/* A typed date (DD-MM-YYYY; also D-M-YY, DD/MM/YYYY, DDMMYYYY or yyyy-mm-dd) -> yyyy-mm-dd for the server.
   '' when blank, '!' + what was typed when it is not a real date. */
function ymd(s) {
  s = String(s == null ? '' : s).trim();
  if (!s) return '';
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/), d, mo, y;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{4}|\d{2})$/)) || (m = s.match(/^(\d{2})(\d{2})(\d{4})$/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
  else return '!' + s;
  if (y < 100) y += 2000;
  var x = new Date(y, mo - 1, d);
  if (y < 2000 || y > 2099 || x.getMonth() !== mo - 1 || x.getDate() !== d) return '!' + s;
  return y + '-' + (mo < 10 ? '0' : '') + mo + '-' + (d < 10 ? '0' : '') + d;
}
/* While typing a date, the dashes come by themselves (phone number keypads have no dash): 05 -> 05-, 05-11 -> 05-11-. */
function fmtDateTyping(el, e) {
  if (e && e.inputType && e.inputType.indexOf('delete') === 0) return;
  var v = el.value.replace(/--+/g, '-');
  if (/^\d{8}$/.test(v)) v = v.slice(0, 2) + '-' + v.slice(2, 4) + '-' + v.slice(4);
  else if (/^\d{2}$/.test(v) || /^\d{1,2}-\d{2}$/.test(v)) v += '-';
  if (v !== el.value) el.value = v;
}
/* Order quantity window (APP_SETTINGS qtyTolerancePct, 1% if not set). Same rule as the server (checkQty_). */
function tol() { var x = D && D.settings ? D.settings.qtyTolerancePct : ''; return x === '' || x == null || isNaN(Number(x)) ? 0.01 : Number(x); }
function days(a, b) { if (!a || !b) return 0; return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
function normTruck(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function normName(s) { return String(s || '').toUpperCase().replace(/\s+/g, ' ').trim(); }
function custN(k) { return k + (k === 1 ? ' customer' : ' customers'); }
function trk(k) { return k + (k === 1 ? ' truck' : ' trucks'); }
function sum(a, f) { return a.reduce(function (x, y) { return x + f(y); }, 0); }
function liveAll() { return T.filter(function (t) { return !t.cx; }); }
function live() { return T.filter(function (t) { return !t.cx && (FIRM === 'all' || t.firm === FIRM); }); }
/* ---------- firms ---------- */
function firms() { var l = String(D && D.settings.firms || '').split(',').map(normName).filter(String); return l.length ? l : ['']; }
function multiFirm() { return firms().filter(String).length > 1; }
function plantFirm() { return normName(D && D.settings.plantFirm || ''); }
function firmOf(o) { return o && o.firm ? normName(o.firm) : firms()[0]; }
function isFirm(name) { return !!name && firms().indexOf(normName(name)) >= 0; }
function shortFirm(f) {
  f = normName(f); if (!f) return '';
  var w = f.split(' '), keep = [];
  for (var i = 0; i < w.length; i++) { if (i > 0 && /^(SOLVEX|TRADING|TRADERS|AND|&|COMPANY|CO\.?|PVT|LTD|PRIVATE|LIMITED)$/.test(w[i])) break; keep.push(w[i]); }
  return keep.map(function (x) { return x.charAt(0) + x.slice(1).toLowerCase(); }).join(' ');
}
function inFirm(o) { return FIRM === 'all' || firmOf(o) === FIRM; }
function tInFirm(t) { return FIRM === 'all' || t.firm === FIRM; }
function firmTag(f) { if (!multiFirm() || !f) return ''; var i = firms().indexOf(normName(f)); return '<span class="ftag f' + (i < 0 ? 2 : i % 3) + '">' + esc(shortFirm(f)) + '</span>'; }
function isPhone() { try { return window.matchMedia('(max-width:860px)').matches; } catch (e) { return window.innerWidth <= 860; } }
function toPlant(t) { var pf = plantFirm(); return !t.cx && !!pf && (t.plantPO || (!!t.so && normName(t.buyer) === pf)); }
function toast(m, undo) {
  var t = $('#toast'); t.innerHTML = esc(m) + (undo ? '<button type="button" class="undo" id="undoBtn">Undo</button>' : ''); t.hidden = false;
  if (undo) $('#undoBtn').onclick = function () { t.hidden = true; undo(); };
  clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, undo ? 7000 : 2800);
}
function terms(o) {
  if (!o) return '';
  var g = o.gstMode === 'incl' ? 'GST incl.' : o.gstMode === 'excl' ? '+ GST' : 'GST not set';
  var f = o.freightMode === 'ours' ? 'freight incl.' : o.freightMode === 'buyer' ? 'customer pays freight' : 'freight not set';
  return g + ', ' + f;
}
/* Weight helper: 5 digits (e.g. 38450) = kg, 3 digits with decimal (384.50) = quintal */
function toQtl(v) { var t = String(v).replace(/,/g, '').trim(); if (t === '') return ''; var x = Number(t); if (isNaN(x)) return NaN; return x >= 1000 ? r2(x / 100) : x; }

/* ---------- links ---------- */
function newTab(view, id) {
  if (!window.APP_URL) return '';
  return '<a class="newtab" href="' + esc(APP_URL + '?view=' + encodeURIComponent(view) + '&id=' + encodeURIComponent(id)) + '" target="_blank" rel="noopener" title="Open in new tab">' + ICON.newtab + '</a>';
}
function ntsm(view, id) { return window.APP_URL && id ? '<a class="ntsm" href="' + esc(APP_URL + '?view=' + encodeURIComponent(view) + '&id=' + encodeURIComponent(id)) + '" target="_blank" rel="noopener" title="Open in new tab">' + ICON.newtab + '</a>' : ''; }
function lnk(view, id, text) { return id ? '<a href="#" data-go="' + esc(view) + '" data-id="' + esc(id) + '">' + esc(text == null ? id : text) + '</a>' : '<span class="mu">—</span>'; }

/* ---------- server calls and login ---------- */
function getTok() { try { return localStorage.getItem('ddgs_token'); } catch (e) { return TOKEN; } }
function setTok(t) { TOKEN = t; try { if (t) localStorage.setItem('ddgs_token', t); else localStorage.removeItem('ddgs_token'); } catch (e) {} }
var OPEN_CALLS = { api_authState: 1, api_login: 1, api_createOwner: 1, api_logout: 1 };
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (!OPEN_CALLS[fn]) args.unshift({ t: TOKEN || getTok(), d: 1 }); // d: 1 = after a save, send back only what changed
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) {
      var msg = (e && e.message) || String(e);
      if (/LOGIN/.test(msg)) { cacheClear(); setTok(null); D = null; closeForm(); showAuth('Please log in again.'); rej(new Error('Please log in again.')); return; }
      rej(new Error(msg));
    });
    r[fn].apply(r, args);
  });
}
function showAuth(note) {
  $('#toast').hidden = true; D = null; $('#nav').innerHTML = ''; $('#who').innerHTML = ''; $('#fab').hidden = true; $('#sync').textContent = 'Not logged in';
  $('#view').innerHTML = '<div id="load">Opening…</div>';
  call('api_authState').then(function (s) {
    if (s.company) $('#co').textContent = s.company;
    if (s.importReport) PENDING_IMPORT = s.importReport;
    if (s.needsOwner && s.isOwnerGoogle) {
      $('#view').innerHTML = '<form class="auth" id="authForm" autocomplete="off"><h3>Create your owner login</h3><p>This is the first login for the app. You will use it to add your staff later.</p>' +
        '<label for="a_user">Username</label><input id="a_user" placeholder="e.g. nitish" autocomplete="off" autocapitalize="none">' +
        '<label for="a_name">Your name</label><input id="a_name" autocomplete="off">' +
        '<label for="a_pw">Password (6+ characters)</label><input id="a_pw" type="password" autocomplete="new-password">' +
        '<label for="a_pw2">Repeat password</label><input id="a_pw2" type="password" autocomplete="new-password">' +
        '<div class="msg err" id="aerr" hidden style="margin:12px 0 0"></div><button class="btn pri" type="submit">Create owner login</button></form>';
      $('#authForm').onsubmit = function (ev) {
        ev.preventDefault();
        if ($('#a_pw').value !== $('#a_pw2').value) return authErr('The two passwords do not match.');
        authSubmit(call('api_createOwner', $('#a_user').value, $('#a_name').value, $('#a_pw').value));
      };
    } else if (s.needsOwner) {
      $('#view').innerHTML = '<div class="auth"><h3>Setup not finished</h3><p>The owner has to open this link first and create the owner login. Ask the owner, then reload this page.</p></div>';
    } else {
      $('#view').innerHTML = '<form class="auth" id="authForm"><h3>Log in</h3><p>' + esc(note || 'Use the username and password the owner gave you.') + '</p>' +
        '<label for="a_user">Username</label><input id="a_user" autocomplete="username" autocapitalize="none">' +
        '<label for="a_pw">Password</label><input id="a_pw" type="password" autocomplete="current-password">' +
        '<div class="msg err" id="aerr" hidden style="margin:12px 0 0"></div><button class="btn pri" type="submit">Log in</button></form>';
      $('#authForm').onsubmit = function (ev) { ev.preventDefault(); authSubmit(call('api_login', $('#a_user').value, $('#a_pw').value)); };
    }
  }).catch(function (e) { $('#view').innerHTML = '<div class="note">Could not open the app: ' + esc(e.message) + '. Reload the page to try again.</div>'; });
}
function authErr(m) { var e = $('#aerr'); e.textContent = m; e.hidden = false; }
function authSubmit(p) {
  var b = $('#authForm .btn'); b.disabled = true; b.textContent = 'Please wait…';
  p.then(function (r) { setTok(r.token); load(); }).catch(function (e) { b.disabled = false; b.textContent = 'Try again'; authErr(e.message); });
}

/* ---------- data ---------- */
/* Saved copy: the app shows the last data at once, then refreshes from the sheet in the background. */
function cacheGet() { try { var c = JSON.parse(localStorage.getItem('ddgs_cache') || 'null'); return c && c.tok === (TOKEN || getTok()) ? c.d : null; } catch (e) { return null; } }
function cachePut(d) { try { localStorage.setItem('ddgs_cache', JSON.stringify({ tok: TOKEN || getTok(), d: d })); } catch (e) {} }
function cacheClear() { try { localStorage.removeItem('ddgs_cache'); } catch (e) {} }
function load(silent) {
  if (BUSY) return;
  if (!(TOKEN || getTok())) { showAuth(); return; }
  if (!D) { var c = cacheGet(); if (c) { setData(c, true); $('#sync').textContent = 'Updating…'; } }
  // With a saved copy: only ask "anything new?" (a tiny answer when nothing changed). Without one: get everything.
  var p = D && D.v ? call('api_sync', D.v, false) : call('api_getData');
  p.then(function (d) {
    if (d && d.same && D) { D.syncedAt = d.syncedAt; if (d.today) D.today = d.today; rebuild(); pump(); }
    else setData(d);
    if (PENDING_IMPORT) { showImport(PENDING_IMPORT); PENDING_IMPORT = null; }
  }).catch(function (e) {
    if (silent) return;
    if (D) toast(e.message);
    else if (!/log in/i.test(e.message)) $('#view').innerHTML = '<div class="note">Could not load data: ' + esc(e.message) + '. Reload the page to try again.</div>';
  });
}
/* All data from the server (or the saved copy when the app opens). */
function setData(d, fromCache) {
  if (!fromCache) { cachePut(d); LASTFULL = Date.now(); }
  D = d; P = d.perm || {};
  rebuild();
  if (!fromCache) pump();
}
/* Works out every truck again and redraws. D = what the server has confirmed; saves still waiting (Q) are laid on top. */
function rebuild() {
  if (!D) return;
  PO = {}; SO = {}; PEND = {};
  D.po.forEach(function (p) { PO[p.id] = p; });
  D.so.forEach(function (s) { SO[s.id] = s; });
  var list = D.trucks;
  if (Q.length) {
    var byId = {};
    list = list.map(function (t) { var c = Object.assign({}, t); byId[c.id] = c; return c; });
    Q.forEach(function (op) { opApply(op, byId, list); (op.ids || []).forEach(function (id) { PEND[id] = 1; }); });
  }
  T = CARRY(list.map(derive));
  flagIssues();
  // Customer accounts (Receivables): confirmed payments plus those still saving.
  PAYS = (D.pays || []).slice();
  Q.forEach(function (op) { if (op.k === 'cpay' && op.data && op.data.row) PAYS.push(op.data.row); });
  ACC = P.money ? custAcc(T, PAYS) : {};
  showSync();
  if (D.settings.company) $('#co').textContent = D.settings.company;
  $('#who').innerHTML = D.me ? '<button type="button" class="who" data-act="me">' + esc((D.me.name || D.me.id).split(' ')[0]) + ' <span class="hide-phone">· ' + esc(D.me.role) + '</span></button>' : '';
  render();
  showFails();
}
/* A reply from a save: only what changed (merged into D), or all data (replaces D). */
function applyResult(d) {
  if (!d || typeof d !== 'object' || !D) return;
  if (!d.delta) { if (d.trucks && d.po && d.settings) setData(d); return; }
  [['trucks', D.trucks], ['po', D.po], ['so', D.so]].forEach(function (x) {
    var list = x[1], at = {};
    list.forEach(function (r, i) { at[r.id] = i; });
    (d[x[0]] || []).forEach(function (r) { if (at.hasOwnProperty(r.id)) list[at[r.id]] = r; else { at[r.id] = list.length; list.push(r); } });
  });
  if (d.notes) D.notes = d.notes;
  if (d.pays) D.pays = d.pays; // customer payments (Receivables)
  if (d.banks) D.banks = d.banks;
  if (d.users) D.users = d.users;
  if (d.today) D.today = d.today;
  if (d.syncedAt) D.syncedAt = d.syncedAt;
  if (D.v && D.v === d.pv) D.v = d.v; // nobody else saved in between: this screen is up to date
  else NEEDSYNC = true;               // someone else saved meanwhile: fetch their changes now, not at the next check
  cachePut(D);
  rebuild();
  if (NEEDSYNC && !Q.length && !QRUN) setTimeout(sync, 0);
}
function showSync() {
  var el = $('#sync');
  if (!el || !D) return;
  el.classList.toggle('busy', Q.length > 0);
  el.textContent = Q.length ? (Q[0].tries ? 'No internet? ' + Q.length + ' waiting to save' : 'Saving ' + Q.length + '…') : 'Synced ' + String(D.syncedAt || '').slice(11);
}

/* ---------- fast saving ----------

        row('Net freight', t.U ? '<span class="' + (t.netFr < 0 ? 'over' : '') + '">' + inr(t.netFr) + '</span>' + (t.carryIn ? ' − ' + inr(t.carryIn) + ' earlier advance = <b>' + inr(t.netPay) + '</b>' : '') + (t.carryOut ? ' <span class="mu">(' + inr(t.carryOut) + ' carried to next trip)</span>' : '') + (t.freightPaid ? ' · <span style="color:var(--ok)">paid ' + dmy(t.freightPaidDate) + '</span>' : '') : '—')) +

function menuItems(t) {
  var m = [];
  if (t.cx) { if (t.returned ? P.trucks : P.cancelTruck) m.push({ a: 'restore', l: t.returned ? 'Undo returned' : 'Restore truck' }); return m; }
  if (t.st === 6 && !P.editClosed) return m;
  if (P.trucks) m.push({ a: 'editTruck', l: 'Edit details' });
  if (P.trucks && t.L) m.push({ a: 'load', l: 'Change loaded weight' });
  if (P.trucks && t.L) m.push({ a: 'bill', l: t.billQ === null ? 'Enter supplier invoice' : 'Change supplier invoice' });
  if (P.trucks && !t.L) m.push({ a: 'returned', l: 'Returned empty', danger: 1 });
  if (P.trucks && !t.plantPO) m.push({ a: 'assign', l: t.so ? 'Change customer' : 'Choose customer' });
  if (P.trucks && t.L) m.push({ a: 'unload', l: toPlant(t) ? (t.U ? 'Change received weight' : 'Mark received') : t.U ? 'Change unloading' : 'Record unloading' });
  if (P.truckMoney) {
    if (t.L && !t.plantPaid) m.push({ a: 'paid', l: 'Mark supplier paid' });
    if (t.plantPaid) m.push({ a: 'unpaid', l: 'Undo supplier payment' });
    if (!t.fBuyer) m.push({ a: 'advance', l: 'Freight advance' });
    if (t.U && !t.fBuyer && !t.freightPaid) m.push({ a: 'fpaid', l: 'Pay freight' });
    if (t.freightPaid) m.push({ a: 'funpaid', l: 'Undo freight payment' });
  }
  if (P.cancelTruck) m.push({ a: 'cancelTruck', l: 'Cancel this truck', danger: 1 });
  return m;
}
